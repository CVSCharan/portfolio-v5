name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    # Needs a mock DATABASE_URL to build Next.js (Prisma Next will skip DB queries at build if dynamic, or try to emit the contract)
    env:
      DATABASE_URL: "postgres://mock:mock@localhost:5432/mock?sslmode=disable"
      NEXTAUTH_SECRET: "mock-secret-for-ci-builds"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Emit Prisma Contract
      run: npm run contract:emit

    - name: Run Linter
      run: npm run lint

    - name: Run Unit & Component Tests (Vitest)
      run: npm run test

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Run E2E Tests (Playwright)
      # Playwright will run `npm run build && npm run start` automatically per playwright.config.ts
      run: npx playwright test

    - name: Upload Playwright Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 15
